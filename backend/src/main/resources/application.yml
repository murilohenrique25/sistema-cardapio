spring:
  application:
    name: sistema-cardapio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cardapio}
    username: ${SPRING_DATASOURCE_USERNAME:cardapio}
    password: ${SPRING_DATASOURCE_PASSWORD:cardapio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://admin.localhost:3000,http://cardapio.localhost:3000}
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-caracteres}
    issuer: sistema-cardapio
    # Um painel operacional permanece aberto durante todo o expediente.
    # Doze horas evitam que ações como mover um pedido falhem no meio do uso.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${APP_BOOTSTRAP_ADMIN_NAME:Administrador da Plataforma}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
