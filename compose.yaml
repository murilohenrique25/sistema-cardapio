services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardapio}
      POSTGRES_USER: ${POSTGRES_USER:-cardapio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardapio}
    ports:
      - "5433:5432"
    volumes:
      - cardapio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cardapio_postgres:
